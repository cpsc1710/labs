:root {
  --bg: #0E1320;
  --panel: #161D2D;
  --panel2: #1C2438;
  --border: #26304A;
  --border2: #36426A;
  --ink: #E8ECF4;
  --ink2: #C4CBDC;
  --muted: #98A1B7;
  /* semantic accents: the same everywhere */
  --e: #5EEAD4;   /* token / embedding */
  --q: #F472B6;   /* query */
  --k: #FBBF24;   /* key */
  --v: #A3E635;   /* value */
  --at: #818CF8;  /* attention weight */
  --o: #FB923C;   /* output / probability */
  --a: #38BDF8;   /* assumption */
  --a-bg: rgba(56,189,248,.10);
  --head: 'Sora', 'Inter', -apple-system, sans-serif;
  --sans: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #070B14; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }

#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative; width: 1600px; height: 900px; flex: none; overflow: hidden; transform-origin: center center;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 900px 500px at 78% 8%, rgba(129,140,248,.10), transparent 70%),
    linear-gradient(rgba(129,140,248,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(129,140,248,.045) 1px, transparent 1px);
  background-size: auto, 40px 40px, 40px 40px;
}

/* ---------- chrome ---------- */
#topbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center;
  padding: 0 56px; gap: 14px; font-size: 16px; color: var(--muted); letter-spacing: .02em; z-index: 5; }
#topbar .part { text-transform: uppercase; letter-spacing: .14em; font-weight: 600; font-size: 15px; color: var(--ink2); }
#topbar .count { margin-left: auto; font-family: var(--mono); font-size: 15px; }
#progress { position: absolute; top: 0; left: 0; height: 4px; background: linear-gradient(90deg, var(--e), var(--at), var(--q)); transition: width .4s ease; z-index: 6; }
#caption { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; padding: 11px 130px 0;
  display: flex; align-items: flex-start; justify-content: center; text-align: center;
  font-family: var(--sans); font-size: 23px; line-height: 1.34; color: var(--ink);
  border-top: 1px solid var(--border); background: rgba(9,13,24,.94); z-index: 5; transition: opacity .3s; }
#caption.off { opacity: 0; pointer-events: none; }
#caption .t { transition: opacity .35s; }
#nav { position: absolute; right: 20px; bottom: 30px; z-index: 7; display: flex; gap: 6px; }
#nav button { width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--border2); background: var(--panel);
  color: var(--ink2); font-size: 18px; cursor: pointer; }
#nav button:hover { background: var(--panel2); }
body.recording #nav, body.recording #help { display: none; }
#help { position: absolute; left: 20px; bottom: 36px; z-index: 7; font-size: 14px; color: var(--muted); }

/* ---------- slides ---------- */
.slide { position: absolute; left: 0; top: 54px; width: 1600px; height: 742px; padding: 14px 90px 0;
  opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.slide.active { opacity: 1; pointer-events: auto; }
.slide h1 { font-family: var(--head); font-weight: 600; font-size: 44px; line-height: 1.15; letter-spacing: -.01em; margin-bottom: 16px; color: var(--ink); }
.slide h2 { font-family: var(--head); font-weight: 600; font-size: 30px; line-height: 1.2; margin-bottom: 10px; }
.slide h3 { font-family: var(--sans); font-weight: 600; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.slide p, .slide li { font-size: 26px; line-height: 1.42; color: var(--ink2); }
.slide p + p { margin-top: 12px; }
.slide ul { list-style: none; }
.slide li { padding-left: 26px; position: relative; margin: 6px 0; }
.slide li::before { content: ''; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 4px; background: var(--border2); }
.lede { font-family: var(--head); font-weight: 400; font-size: 30px !important; line-height: 1.35 !important; color: var(--ink) !important; }
.small { font-size: 21px !important; line-height: 1.4 !important; }
.muted { color: var(--muted) !important; }
b, strong { color: var(--ink); font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: .9em; }

/* semantic colours */
.e { color: var(--e); } .q { color: var(--q); } .k { color: var(--k); } .v { color: var(--v); }
.at { color: var(--at); } .o { color: var(--o); } .as { color: var(--a); }
b.e, b.q, b.k, b.v, b.at, b.o, b.as { font-weight: 600; }
.be { background: rgba(94,234,212,.13); } .bq { background: rgba(244,114,182,.13); } .bk { background: rgba(251,191,36,.13); }
.bv { background: rgba(163,230,53,.13); } .bat { background: rgba(129,140,248,.16); } .bo { background: rgba(251,146,60,.14); }

/* reveal-by-step */
[data-step] { transition: opacity .45s ease, transform .45s ease; }
.hidden-step { opacity: 0 !important; transform: translateY(10px); pointer-events: none; }
.dim-step { opacity: .3 !important; }

/* layout helpers */
.row { display: flex; gap: 44px; align-items: flex-start; }
.col { flex: 1; min-width: 0; }
.center { text-align: center; }
.stack > * + * { margin-top: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 26px; }

/* callouts */
.assume { border-left: 4px solid var(--a); background: var(--a-bg); border-radius: 0 10px 10px 0; padding: 12px 18px; }
.assume::before { content: 'ASSUMPTION'; display: block; font-size: 17px; font-weight: 600; letter-spacing: .16em; color: var(--a); margin-bottom: 4px; }
.assume.plural::before { content: 'ASSUMPTIONS'; }
.assume p, .assume li { font-size: 24px !important; color: var(--ink) !important; }
.keyidea { border-left: 4px solid var(--ink); background: rgba(232,236,244,.07); border-radius: 0 10px 10px 0; padding: 12px 18px; }
.keyidea::before { content: 'KEY IDEA'; display: block; font-size: 17px; font-weight: 600; letter-spacing: .16em; color: var(--ink2); margin-bottom: 4px; }
.keyidea p { font-size: 25px !important; color: var(--ink) !important; }
.honest { border-left: 4px solid var(--o); background: rgba(251,146,60,.09); border-radius: 0 10px 10px 0; padding: 12px 18px; }
.honest::before { content: 'HONEST NOTE'; display: block; font-size: 17px; font-weight: 600; letter-spacing: .16em; color: var(--o); margin-bottom: 4px; }
.honest p { font-size: 24px !important; color: var(--ink) !important; }

/* symbols and equations */
.eq { font-family: var(--head); font-weight: 400; font-size: 34px; text-align: center; color: var(--ink); letter-spacing: .01em; }
.eq sub { font-size: .6em; } .eq sup { font-size: .6em; }
.eq .op { color: var(--muted); padding: 0 .12em; }
.sy { font-family: var(--head); font-weight: 600; font-style: normal; }
.sy sub { font-size: .62em; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: baseline; }
.legend .sym { font-family: var(--head); font-weight: 600; font-size: 28px; text-align: right; white-space: nowrap; }
.legend .def { font-size: 23px; color: var(--ink2); line-height: 1.35; }

/* Week 6 "What is an AI agent?". assets/deck.css is an unmodified copy of the CPSC 1710 Week 5 stylesheet;
   this file re-colours it (a light "daylight" palette) and adds the pieces this deck needs. */

:root {
  --bg: #F4F6FA;
  --panel: #FFFFFF;
  --panel2: #E9EDF5;
  --border: #D3D9E6;
  --border2: #AEB8CE;
  --ink: #131A2A;
  --ink2: #384257;
  --muted: #667089;
  /* who is speaking: the same four colours on every slide */
  --you: #1F55D0;    /* the person */
  --mod: #9A2BB8;    /* the model writes */
  --prog: #0A7B73;   /* the program acts (runs a tool) */
  --res: #A85800;    /* a result comes back */
  --bad: #C42B3A;
  --ok: #23803A;
  /* the engine's own accent names, pointed at this palette */
  --e: var(--prog); --q: var(--mod); --k: var(--res); --v: var(--ok); --at: var(--you); --o: var(--res); --a: var(--you);
  --a-bg: rgba(31,85,208,.07);
}

html, body { background: #DDE2EC; }
#stage {
  background-color: var(--bg);
  background-image: radial-gradient(rgba(19,26,42,.075) 1.2px, transparent 1.3px);
  background-size: 28px 28px;
  box-shadow: 0 0 0 1px var(--border);
}
#caption { background: rgba(255,255,255,.97); border-top: 1px solid var(--border); color: var(--ink); }
#progress { background: linear-gradient(90deg, var(--you), var(--mod), var(--prog)); }
#help { bottom: 8px; }
#nav button { background: var(--panel); }
.card { box-shadow: 0 1px 2px rgba(19,26,42,.05); }
.keyidea { background: rgba(19,26,42,.045); }
.honest { background: rgba(168,88,0,.08); }
.bars .track { background: rgba(19,26,42,.08); }
table.data tr.hl td { background: rgba(31,85,208,.08); }
select, input[type=text] { background: #fff; }
a { color: var(--you); }
.btn { background: var(--panel); }
.btn:hover { border-color: var(--ink2); }
.btn[disabled] { opacity: .4; cursor: default; }
pre.code { background: #FBFCFE; }
pre.code .ln.hl { background: rgba(31,85,208,.12); }
pre.code .cm { color: #7A849B; }
.gen { background: #FBFCFE; }
.be { background: rgba(10,123,115,.10); } .bq { background: rgba(154,43,184,.09); } .bo { background: rgba(168,88,0,.10); } .bat { background: rgba(31,85,208,.09); }

/* role colours as text */
.you { color: var(--you); } .mod { color: var(--mod); } .prog { color: var(--prog); } .res { color: var(--res); } .bad { color: var(--bad); } .ok { color: var(--ok); }
b.you, b.mod, b.prog, b.res, b.bad, b.ok { font-weight: 600; }

/* callouts */
.policy { border-left: 4px solid var(--ok); background: rgba(35,128,58,.08); border-radius: 0 10px 10px 0; padding: 12px 18px; }
.policy::before { content: 'FOR POLICY WORK'; display: block; font-size: 17px; font-weight: 600; letter-spacing: .16em; color: var(--ok); margin-bottom: 4px; }
.policy p { font-size: 24px !important; color: var(--ink) !important; }
.try { display: inline-block; font-size: 16px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border-radius: 5px;
  background: rgba(31,85,208,.10); color: var(--you); border: 1px solid rgba(31,85,208,.45); vertical-align: middle; }
.src { position: absolute; left: 90px; right: 90px; bottom: 8px; font-size: 17px !important; color: var(--muted) !important; }
.big { font-family: var(--head); font-weight: 600; font-size: 80px; line-height: 1; letter-spacing: -.02em; color: var(--ink); }

/* one message in the list that is sent to the model */
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { border: 1px solid var(--border); border-left-width: 5px; border-radius: 9px; background: var(--panel); padding: 7px 14px 8px; transition: opacity .35s, transform .35s, box-shadow .3s; }
.msg .who { font-size: 14px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 2px; }

   slide({part, title, html, says:[...], init(el,S), enter(el,S), step(el,k,S,prev), leave(el,S)})

(function () {
  const SL = (window.SLIDES = []);

    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

    let acc = 0;

    return probs.length - 1;
  };
  U.softmax = (z, T = 1) => {
    const m = Math.max(...z.map((v) => v / T));
    const e = z.map((v) => Math.exp(v / T - m));
    const s = e.reduce((a, b) => a + b, 0);
    return e.map((v) => v / s);
  };
  U.fmt = (v, d = 2) => (Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(1) : v.toFixed(d));

  U.bars = (items, opt = {}) =>
    `<div class="bars">${items.map((it) => `<div class="b"><div class="lab">${U.esc(it.lab)}</div><div class="track"><div class="fill" style="width:${(it.p * 100 * (opt.scale || 1)).toFixed(1)}%;background:${it.color || 'var(--o)'}"></div></div><div class="num">${it.num ?? (it.p * 100).toFixed(0) + '%'}</div></div>`).join('')}</div>`;

    `<pre class="code">${src.split('\n').map((l) => {
      let s = U.esc(l);

      s = s.replace(/\b(for|in|def|return|import|as|while|if|not|raise|class|self)\b(?![^<]*<\/span>)/g, '<span class="kw">$1</span>');

    return def;
  }

  function applySteps(el, k) {
    U.$$(el, '[data-step]').forEach((n) => {
      const [a, b] = n.dataset.step.split('-').map(Number);
      const vis = k >= a && (isNaN(b) || k <= b);
      n.classList.toggle('hidden-step', !vis);
    });
    U.$$(el, '[data-dim]').forEach((n) => n.classList.toggle('dim-step', k >= Number(n.dataset.dim)));
  }

  function sayText(def, k) {
    const s = def.says[k];
    return typeof s === 'function' ? s(def) : s;
  }

  function go(i, k) {
    i = Math.max(0, Math.min(SL.length - 1, i));
    const def = build(i);
    k = Math.max(0, Math.min(def.says.length - 1, k));
    const prevK = i === cur ? step : -1;
    if (i !== cur) {
      if (cur >= 0) {
        const old = SL[cur];
        old.T.clear();
        old.el.classList.remove('active');
        if (old.leave) old.leave(old.el, old);
      }
      def.el.classList.add('active');
      cur = i;
      if (def.enter) def.enter(def.el, def);
    }
    def.T.clear();
    step = k;
    applySteps(def.el, k);
    if (def.step) def.step(def.el, k, def, prevK);
    // chrome
    U.$(stage, '#topbar .part').textContent = def.part || '';
    U.$(stage, '#topbar .ttl').textContent = def.title || '';
    U.$(stage, '#topbar .count').textContent = `${i + 1} / ${SL.length}`;
    U.$(stage, '#progress').style.width = `${((i + (k + 1) / def.says.length) / SL.length) * 100}%`;
    capT.style.opacity = 0;
    const txt = sayText(def, k);
    setTimeout(() => { capT.textContent = txt; capT.style.opacity = 1; }, 180);
    history.replaceState(null, '', `${location.search}#${i + 1}.${k + 1}`);
  }

  function next() {
    const def = SL[cur];
    if (step < def.says.length - 1) go(cur, step + 1);
    else if (cur < SL.length - 1) go(cur + 1, 0);
  }
  function prev() {
    if (step > 0) go(cur, step - 1);
    else if (cur > 0) { const d = build(cur - 1); go(cur - 1, d.says.length - 1); }
  }

  window.deck = {
    go, next, prev,
    state: () => ({ slide: cur, step, nSlides: SL.length, nSteps: SL[cur].says.length, say: sayText(SL[cur], step) }),
    all: () => SL.map((d, i) => ({ i, n: d.says.length })),
    sayOf: (i, k) => sayText(build(i), k),
    holdOf: (i, k) => (build(i).holds || [])[k] || 0,
  };

  window.addEventListener('DOMContentLoaded', () => {
    stage = document.getElementById('stage');
    stage.insertAdjacentHTML('afterbegin', `<div id="progress"></div>
      <div id="topbar"><span class="part"></span><span class="ttl"></span><span class="count"></span></div>
      <div id="caption"><span class="t"></span></div>
      <div id="nav"><button id="bprev" title="Back (←)">‹</button><button id="bnext" title="Next (→ or space)">›</button></div>
      <div id="help">→ next · ← back · N narration · F fullscreen</div>`);
    cap = U.$(stage, '#caption');
    capT = U.$(stage, '#caption .t');
    if (params.has('rec')) document.body.classList.add('recording');
    if (params.get('narration') === 'off') cap.classList.add('off');
    U.$(stage, '#bnext').onclick = next;
    U.$(stage, '#bprev').onclick = prev;
    fit();
    addEventListener('resize', fit);
    addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
      else if (e.key === 'Home') go(0, 0);
      else if (e.key === 'End') go(SL.length - 1, 0);
      else if (e.key === 'n' || e.key === 'N') cap.classList.toggle('off');
      else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
      }
    });
    const m = location.hash.match(/#(\d+)(?:\.(\d+))?/);
    go(m ? Number(m[1]) - 1 : 0, m && m[2] ? Number(m[2]) - 1 : 0);
  });
})();

  const out = [];

}).join('')}</pre>`;

/* The loop drawing. Four boxes, six arrows. U.loopSet(el, phase) lights one arrow and the two boxes it joins. */
const PH = { task: ['you', 'mod'], ask: ['mod', 'prog'], run: ['prog', 'world'], res: ['world', 'prog'], back: ['prog', 'mod'], ans: ['mod', 'you'] };

      <text x="${(x1 + x2) / 2}" y="${d > 0 ? y - 14 : y + 28}" text-anchor="middle">${lab}</text></g>`;

};
U.loopSet = (el, phase, faded = []) => {

};

  </div>
  <div class="keyidea" data-step="4" style="margin-top:20px"><p>The model never touches the world. It writes a request, and a program decides whether and how to carry it out. That program is often called the <b>harness</b>. Every limit on an agent lives in the harness.</p></div>`,
  says: [
    'This is the idea that the rest depends on. A language model can do one thing: read text and write more text. It cannot open a file, visit a website or send an email.',
    'So how does an agent act? The model writes a request, in an agreed format. Here it asks for a tool called read file, and names the file. A program reads that line.',
    'The program is ordinary software. It opens the file and copies its text. The model did not do this. The program did.',
    'The text of the file becomes the result. The program adds it to the list of messages and calls the model again, so the model can read it.',

  ],

// ───────────────────────────── 7. Tools: looking and changing
const TOOLQ = [
  ['Search the web', 0, 'It fetches pages. Nothing outside is changed.'],

// ───────────────────────────── 8. A dial of autonomy
const DIAL = [
  ['Suggests', 'It proposes. You carry out every action yourself.', 'Everything, before it happens.', 'Copying an answer out of a chat window.'],

// ───────────────────────────── 9. Is it an agent?
const ISIT = [

slide({

// ───────────────────────────── 10. Small errors add up
slide({
  part: 'Part 1 · The idea', title: 'Long tasks',
  html: `
  <h1>Why long tasks are harder than short ones <span class="try">Try it</span></h1>

    <div class="col stack">

        <div class="slider" style="grid-template-columns:230px 1fr 90px"><span class="lab" style="font-size:21px;text-align:left">Steps in the task</span><input type="range" class="er-n" min="1" max="60" value="20"><span class="val er-nv"></span></div>
        <div class="slider" style="grid-template-columns:230px 1fr 90px;margin-top:14px"><span class="lab" style="font-size:21px;text-align:left">Each step goes right</span><input type="range" class="er-p" min="80" max="99.5" step="0.5" value="95"><span class="val er-pv"></span></div>
      </div>

      <div class="keyidea" data-step="1"><p>The third assumption is the one agents can break. An agent that can check its work, for example by running a test or re-reading a total, catches some mistakes and tries again. Tasks with a built-in check suit agents much better than tasks without one.</p></div>
    </div>
    <div style="flex:none;width:520px" class="card center">

      $(el, '.er-out').textContent = (all * 100 < 10 ? (all * 100).toFixed(1) : Math.round(all * 100)) + '%';

// ───────────────────────────── 11. What to use an agent for
slide({
  part: 'Part 1 · The idea', title: 'What to use an agent for',
  html: `

    'It also fits poorly when it cannot reach the material, and when the point of the work is for you to learn it.',

});

<script>/* slides-build.js */
/* CPSC 1710 build slides, adapted from GLBL 5053. Main walkthrough: authored role-play example.
   Historical model comparisons and the invented-result example retain their original recorded data. */
(function () {
const { $, $$, esc } = U;
const AG = window.AG, RUN = AG.run, ST = RUN.steps;
const P2 = 'Part 2 · Build one';

const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '$1');              // models write **bold**; show the words only
const sysShort = U.msg('sys', 'The tool descriptions from Step 2', { cls: 'small' });
const go = (title) => { const i = window.SLIDES.findIndex((s) => s.title === title); if (i >= 0) deck.go(i, 0); };

// ───────────────────────────── 12. The plan and the desk
const PLAN = [
  ['One call', 'Ask the model the question directly.', 'Step 1 · One call'],
  ['Describe tools', 'Tell it, in words, what it may ask for.', 'Step 2 · Describe the tools'],
  ['Run a tool by hand', 'You play the part of the program.', 'Step 3 · You are the program'],
  ['The loop', 'Let the program repeat what you did.', 'Step 4 · The loop'],
  ['Stopping', 'The two ways a loop ends.', 'Step 5 · Stopping'],
  ['Limits', 'Text it should not obey, and actions it should ask about.', 'Step 6 · Text is not an order'],
];
slide({
  part: P2, title: 'The plan',
  html: `
  <h1>A tiny agent in six steps</h1>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px">
    ${PLAN.map(([a, b, t], i) => `<div class="card stepcard" data-go="${t}"><div class="no">${i + 1}</div><h2>${a}</h2><p>${b}</p></div>`).join('')}
  </div>
  <div class="row" style="margin-top:20px;gap:26px" data-step="1">
    <div style="flex:none;width:500px">
      <h3>The desk: three made-up files <span class="try" style="margin-left:6px">Try it</span></h3>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">${Object.keys(AG.desk).map((f) => `<span class="file" data-f="${f}">${f}</span>`).join('')}</div>

    </div>

      <p class="small muted" style="margin-top:8px">A person answers the question by opening two of these files and counting days on a calendar. We want the agent to do the same.</p></div>
  </div>`,
  init(el, S) {
    $$(el, '.stepcard').forEach((c) => (c.onclick = () => go(c.dataset.go)));
    S.show = (f) => { $$(el, '.file').forEach((x) => x.classList.toggle('on', x.dataset.f === f)); $(el, '.pl-n').textContent = f; $(el, '.pl-p').textContent = AG.desk[f].trim(); };
    $$(el, '.file').forEach((x) => (x.onclick = () => S.show(x.dataset.f)));
    S.show('deadlines.txt');
  },
  says: [
    'We build the agent in six small steps. Each one adds a single thing, and each is a cell you will run in the lab notebook. Click a card to jump ahead.',
    'The task is deliberately small. A folder, which we call the desk, holds three made-up files. The question needs two of them, plus a count of days. Click each file to see what is in it.',
  ],
});

// ───────────────────────────── 13. Step 1 · One call
slide({
  part: P2, title: 'Step 1 · One call',
  html: `
  <h1>Step 1. Ask the model directly</h1>
  <div class="row" style="gap:36px">
    <div style="flex:none;width:760px" class="msgs">
      <h3>The list of messages</h3>

    </div>

// ───────────────────────────── 14. Step 2 · Describe the tools
const SYSL = AG.system.split('\n');
const ZONE = [0, 1, 1, -1, 2, 2, 2, 2, -1, 3, 3, 3];
slide({
  part: P2, title: 'Step 2 · Describe the tools',
  html: `
  <h1>Step 2. Describe the tools, in words</h1>
  <div class="row" style="gap:30px">

  step(el, k) {

// ───────────────────────────── 15. The model asks. Nothing happens.
const OC = lines(AG.oneCall);
slide({

      <div class="honest" data-step="2"><p>The reply did not end there. The model repeated the request seven more times, then gave up and asked us for the files. It does not stop and wait for a result. It writes until it has nothing more to write.</p></div>
      <div class="keyidea" data-step="3"><p>So the program takes the first line and discards the rest. Where the model’s turn ends is decided by the program.</p></div>

  </div>
  <p class="src">Model: ${AG.model}, recorded ${AG.date}. Blank lines in the reply are left out.</p>`,
  step(el, k) { $(el, '.oc-a').style.display = k >= 2 ? 'none' : ''; $(el, '.oc-b').style.display = k >= 2 ? '' : 'none'; },
  says: [
    'We send the same question again, this time with the instructions in front. Now the reply begins with a request: list the files.',
    'Nothing has happened. No file was listed. The model produced a line of text, and until a program reads that line and acts on it, nothing in the world changes.',
    'Here is the whole reply. The model did not stop after one line. It repeated the request seven more times and then gave up. A model does not wait for anything. It writes until it runs out.',
    'So the program keeps the first line and throws the rest away. This is the first job of the program around a model: deciding where the model’s turn ends.',
  ],

// ───────────────────────────── 16. Step 3 · You are the program
const BTN = [['list_files', '', 'list_files'], ['read_file', 'deadlines.txt', 'read_file  deadlines.txt'], ['read_file', 'presentation-instructions.txt', 'read_file  presentation-instructions.txt'],
             ['read_file', 'team-notes.txt', 'read_file  team-notes.txt'], ['days_until', '2026-12-07', 'days_until  2026-12-07'], ['days_until', '2026-11-19', 'days_until  2026-11-19']];
slide({
